name: APK

# Cada push a main compila la app y deja el APK listo para descargar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Se usa Gradle del runner en lugar del wrapper: asi el repositorio no
      # necesita llevar dentro el gradle-wrapper.jar binario.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Las pruebas del interprete corren antes de compilar: si una regla de
      # interpretacion se rompe, el APK no llega a generarse.
      - name: Probar y compilar
        id: construir
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest :app:assembleRelease \
            --no-daemon --stacktrace --console=plain 2>&1 | tee registro.txt

      # Ver los logs de Actions exige iniciar sesion, incluso en un repositorio
      # publico. Publicarlos como fichero suelto los deja accesibles con una
      # simple descarga, que es lo que permite corregir un fallo sin tener que
      # entrar a la web a copiarlo a mano.
      - name: Publicar el registro
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p registro
          cp registro.txt registro/salida.txt 2>/dev/null || echo "sin salida" > registro/salida.txt
          # Los informes de las pruebas dicen que caso concreto fallo.
          find app/build/test-results -name "*.xml" -exec cat {} \; \
            > registro/pruebas.xml 2>/dev/null || true
          gh release delete registro -y --cleanup-tag 2>/dev/null || true
          gh release create registro registro/salida.txt registro/pruebas.xml \
            --title "Registro del ultimo intento" \
            --notes "Salida completa de la compilacion mas reciente." || true

      - name: Renombrar el APK
        if: steps.construir.outcome == 'success'
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/Nebula.apk

      - uses: actions/upload-artifact@v4
        if: steps.construir.outcome == 'success'
        with:
          name: Nebula-APK
          path: salida/Nebula.apk

      # Publica el APK en una release fija que siempre apunta a lo ultimo.
      # Con gh en vez de una accion: si falla, el motivo sale en este mismo
      # registro en lugar de quedarse dentro de los logs de Actions.
      - name: Publicar el APK
        if: steps.construir.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ultima             --title "Ultima version"             --notes "APK de Nebula compilado desde el ultimo commit de main."             2>/dev/null || true
          # El APK se llamaba antes CalendarRemember.apk: se retira para que
          # en la release no queden dos ficheros distintos.
          gh release delete-asset ultima CalendarRemember.apk -y 2>/dev/null || true
          gh release upload ultima salida/Nebula.apk --clobber

      # El paso de compilar no corta el flujo para que el registro llegue a
      # publicarse; el resultado real del build se refleja aqui.
      - name: Resultado
        if: steps.construir.outcome != 'success'
        run: |
          echo "La compilacion fallo. El registro esta en la release 'registro'."
          exit 1
