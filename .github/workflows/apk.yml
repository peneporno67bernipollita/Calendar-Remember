name: APK

# Cada push a main compila la app y deja el APK listo para descargar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Se usa Gradle del runner en lugar del wrapper: asi el repositorio no
      # necesita llevar dentro el gradle-wrapper.jar binario.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pruebas del interprete de voz
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/CalendarRemember.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalendarRemember-APK
          path: salida/CalendarRemember.apk

      # Publica el APK en una release fija que siempre apunta a lo ultimo.
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Ultima version
          body: |
            APK de Calendar Remember compilado desde el ultimo commit de main.
            Descarga CalendarRemember.apk e instalalo en el movil.
          files: salida/CalendarRemember.apk
