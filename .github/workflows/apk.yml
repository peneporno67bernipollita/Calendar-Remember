name: APK

# Cada push a main compila la app y deja el APK listo para descargar. La rama
# "pruebas" compila y prueba igual, pero no publica: sirve para comprobar un
# cambio grande sin que la release pase por versiones a medias.
on:
  push:
    branches: [main, pruebas]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Se usa Gradle del runner en lugar del wrapper: asi el repositorio no
      # necesita llevar dentro el gradle-wrapper.jar binario.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # El modelo de voz en espanol (40 MB) no va en el repositorio: se baja
      # al compilar y se guarda en cache para no descargarlo cada vez.
      - uses: actions/cache@v4
        id: cache-modelo
        with:
          path: app/src/main/assets/modelo-es
          key: vosk-model-small-es-0.42

      - name: Modelo de voz en espanol
        if: steps.cache-modelo.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q modelo.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/modelo-es
          mv vosk-model-small-es-0.42 app/src/main/assets/modelo-es
          # La app compara esta marca para saber si su copia esta al dia.
          echo "vosk-model-small-es-0.42" > app/src/main/assets/modelo-es/version

      # Las pruebas del interprete corren antes de compilar: si una regla de
      # interpretacion se rompe, el APK no llega a generarse.
      - name: Probar y compilar
        id: construir
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest :app:assembleRelease \
            --no-daemon --stacktrace --console=plain 2>&1 | tee registro.txt

      # Ver los logs de Actions exige iniciar sesion, incluso en un repositorio
      # publico. El registro se deja en una rama aparte, de donde se lee con
      # una descarga simple: es lo que permite corregir un fallo sin entrar a
      # la web a copiarlo a mano.
      - name: Publicar el registro
        if: always()
        run: |
          mkdir -p /tmp/reg
          cp registro.txt /tmp/reg/salida.txt 2>/dev/null || echo "sin salida" > /tmp/reg/salida.txt
          # Los informes de las pruebas dicen que caso concreto fallo.
          find app/build/test-results -name '*.xml' -exec cat {} + > /tmp/reg/pruebas.xml 2>/dev/null || true
          touch /tmp/reg/pruebas.xml
          git config user.name "CI"
          git config user.email "ci@nebula.local"
          git checkout --orphan registro-ci
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/reg/salida.txt /tmp/reg/pruebas.xml .
          git add -f salida.txt pruebas.xml
          # El APK va tambien aqui: con el repositorio privado, las descargas
          # de Releases exigen sesion en la web, pero esta rama se baja con
          # git y las credenciales de siempre.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Nebula.apk
            git add -f Nebula.apk
          fi
          git commit -q -m "Registro de ${GITHUB_SHA:0:7}"
          git push -f -q origin registro-ci

      - name: Renombrar el APK
        if: steps.construir.outcome == 'success'
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/Nebula.apk

      - uses: actions/upload-artifact@v4
        if: steps.construir.outcome == 'success'
        with:
          name: Nebula-APK
          path: salida/Nebula.apk

      # Publica el APK en una release fija que siempre apunta a lo ultimo.
      - name: Publicar el APK
        if: steps.construir.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ultima \
            --title "Ultima version" \
            --notes "APK de Nebula compilado desde el ultimo commit de main." \
            2>/dev/null || true
          gh release upload ultima salida/Nebula.apk --clobber

      # El paso de compilar no corta el flujo para que el registro llegue a
      # publicarse; el resultado real del build se refleja aqui.
      - name: Resultado
        if: steps.construir.outcome != 'success'
        run: |
          echo "La compilacion fallo. El registro esta en la rama registro-ci."
          exit 1
